services:
  - type: web
    name: campus-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: CORS_ORIGINS
        value: "*"
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile